<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.5, maximum-scale=3.0, user-scalable=yes, viewport-fit=cover">
  <meta name="author" content="深圳市陆深三和科技有限公司"> 
  <meta name="keywords" content="%VITE_APP_NAME%,陆深三和,解锁,查询,批量查询,IMEI" />
  <meta name="description" content="十年老站，为手机维修人员提供解锁、批量查询服务。">
  <link rel="shortcut icon" href="%VITE_APP_MODE%/favicon.png" type="image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&family=Noto+Serif+SC&display=swap" rel="stylesheet">
  <title>%VITE_APP_NAME%</title>
  <script>
  ;(function initTheme() {
    const html = document.documentElement
    const storedTheme = localStorage.getItem('theme')
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
    const applyTheme = storedTheme || (systemTheme ? 'dark' : 'light')

    storedTheme && localStorage.setItem('theme', applyTheme)
    html.classList.add(applyTheme)
  })()

  ;(function initLocale() {
    let locale = localStorage.getItem('locale')

    if(!locale) {
      locale = navigator.language.startsWith('zh') ? 'zh' : 'en'
    }

    localStorage.setItem('locale', locale)
  })()
  </script>
</head>
<body class="noto-sans-sc">
  <div id="app"></div>
  <div id="xbtn-splits"></div>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>

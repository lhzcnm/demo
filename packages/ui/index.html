<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC&family=Noto+Serif+SC&display=swap" rel="stylesheet">
  <title>@3un/ui</title>
  <script>
  ;(function initTheme() {
    const html = document.documentElement
    const storedTheme = localStorage.getItem('theme')
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches
    const applyTheme = storedTheme || (systemTheme ? 'dark' : 'light')

    storedTheme && localStorage.setItem('theme', applyTheme)
    html.classList.add(applyTheme)
  })()
  </script>
</head>
<body class="noto-sans-sc">
  <div id="app"></div>
  <div id="xbtn-splits"></div>
  <script type="module" src="./docs/main.ts"></script>
</body>
</html>
